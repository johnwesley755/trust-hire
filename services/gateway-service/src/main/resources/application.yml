spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: worker-service
          uri: ${WORKER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/worker/**, /api/v1/levels/**, /api/v1/skill-tests/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: employer-service
          uri: ${EMPLOYER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/employer/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: job-service
          uri: ${JOB_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - RewritePath=/api/v1/jobs/(?<segment>.*), /api/jobs/$\{segment}

        - id: target-worker-service-direct
          uri: ${WORKER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/workers/**
          filters:
            - RewritePath=/api/v1/workers/(?<segment>.*), /api/worker/$\\{segment}

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: verification-service
          uri: ${VERIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/verification/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: rating-service
          uri: ${RATING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/ratings/**
          filters:
            - RewritePath=/api/v1/ratings/(?<segment>.*), /api/ratings/$\{segment}

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RewritePath=/api/v1/notifications/(?<segment>.*), /api/notifications/$\{segment}

        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/media/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        - id: websocket-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/ws/**
          filters:
            - RewritePath=/ws/(?<segment>.*), /ws/$\\{segment}


server:
  port: ${PORT:9000}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
