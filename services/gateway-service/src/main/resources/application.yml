spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/api/auth/**
          filters:
            - StripPrefix=2

        - id: worker-service
          uri: ${WORKER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/api/worker/**,/api/v1/api/levels/**,/api/v1/api/skill-tests/**
          filters:
            - StripPrefix=2

        - id: employer-service
          uri: ${EMPLOYER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/api/employer/**
          filters:
            - StripPrefix=2

        - id: job-service
          uri: ${JOB_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/api/jobs/**
          filters:
            - StripPrefix=2

        - id: target-worker-service-direct
          uri: ${WORKER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/workers/**
          filters:
            - RewritePath=/api/v1/workers/(?<segment>.*), /api/worker/$\\{segment}

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/api/search/**
          filters:
            - StripPrefix=2

        - id: verification-service
          uri: ${VERIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/api/verification/**
          filters:
            - StripPrefix=2

        - id: rating-service
          uri: ${RATING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/api/ratings/**
          filters:
            - StripPrefix=2

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/api/notifications/**
          filters:
            - StripPrefix=2

        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/api/media/**
          filters:
            - StripPrefix=2

        - id: websocket-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/ws/**
          filters:
            - RewritePath=/ws/(?<segment>.*), /ws/$\\{segment}


server:
  port: 9000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
