spring:
  application:
    name: media-service
  
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trusthire_media_db}
    username: ${SPRING_DATASOURCE_USERNAME:trusthire_user}
    password: ${SPRING_DATASOURCE_PASSWORD:trusthire123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: false
    baseline-on-migrate: false
    repair-on-migrate: true
    table: flyway_schema_history_media
    locations: classpath:db/migration
  

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

server:
  port: 8089

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
