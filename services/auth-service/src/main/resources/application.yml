spring:
  application:
    name: auth-service
  
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/trusthire_auth_db}
    username: ${POSTGRES_USER:trusthire_user}
    password: ${POSTGRES_PASSWORD:trusthire123}
    driver-class-name: org.postgresql.Driver
    # Neon pooling optimization
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: false
    repair-on-migrate: true
    table: flyway_schema_history_auth
    locations: classpath:db/migration
  
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_API_KEY}
    properties:
      mail:
        from:
          email: ${BREVO_SENDER_EMAIL}
          name: ${BREVO_SENDER_NAME}
        smtp:
          auth: true
          starttls:
            enable: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_FRONTEND_API}

server:
  port: ${AUTH_SERVICE_PORT:8081}

# Clerk Webhook Secret for validation
clerk:
  secret-key: ${CLERK_SECRET_KEY}
  webhook:
    secret: ${CLERK_WEBHOOK_SECRET}

# Cloudinary for media orchestration (if needed by Auth)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  jwt:
    expiration: 86400000 # 24 hours
