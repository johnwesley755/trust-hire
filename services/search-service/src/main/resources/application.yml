spring:
  application:
    name: search-service
  
  datasource:
    url: ${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/trusthire_search_db}
    username: ${POSTGRES_USER:trusthire_user}
    password: ${POSTGRES_PASSWORD:trusthire123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: false
  

server:
  port: 8088

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
