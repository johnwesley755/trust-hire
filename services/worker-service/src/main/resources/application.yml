spring:
  application:
    name: worker-service
  
  datasource:
    url: ${WORKER_DB_URL:jdbc:postgresql://localhost:5432/trusthire_worker_db}
    username: ${POSTGRES_USER:trusthire_user}
    password: ${POSTGRES_PASSWORD:trusthire123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: false
    repair-on-migrate: true
    validate-on-migrate: false
    table: flyway_schema_history_worker
    locations: classpath:db/migration
  

server:
  port: ${WORKER_SERVICE_PORT:8082}
