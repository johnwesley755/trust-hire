<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustHyre | Trusted talent. Better hiring.</title>
    <meta name="description" content="TrustHyre is India's premier verified workforce and talent platform. Connect verified blue-collar and skilled workers with top employers through smart escrow and instant hiring." />
    <meta name="keywords" content="TrustHyre, skilled workers, verified hiring, blue collar jobs, workforce platform, India jobs, electrician hiring, plumber hiring, warehouse staff" />
    <meta name="theme-color" content="#0f2f63" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="canonical" href="https://trusthyre.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrustHyre" />
    <meta property="og:url" content="https://trusthyre.com/" />
    <meta property="og:title" content="TrustHyre | Trusted talent. Better hiring." />
    <meta property="og:description" content="India's verified skilled workforce and talent hiring network with biometric verification and smart escrow protection." />
    <meta property="og:image" content="https://trusthyre.com/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trusthyre.com/" />
    <meta name="twitter:title" content="TrustHyre | Trusted talent. Better hiring." />
    <meta name="twitter:description" content="India's verified skilled workforce and talent hiring network with biometric verification and smart escrow protection." />
    <meta name="twitter:image" content="https://trusthyre.com/logo.png" />

    <!-- Schema.org JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trusthyre.com/#organization",
          "name": "TrustHyre",
          "url": "https://trusthyre.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://trusthyre.com/logo.png"
          },
          "description": "India's premier verified skilled workforce and talent hiring network with biometric verification and smart escrow protection."
        },
        {
          "@type": "WebSite",
          "@id": "https://trusthyre.com/#website",
          "url": "https://trusthyre.com/",
          "name": "TrustHyre",
          "publisher": {
            "@id": "https://trusthyre.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://trusthyre.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
