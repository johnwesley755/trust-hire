services:
  # --- API GATEWAY ---
  - type: web
    name: trusthire-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/gateway-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 9000
      - key: AUTH_SERVICE_URL
        value: http://trusthire-auth:8081
      - key: WORKER_SERVICE_URL
        value: http://trusthire-worker:8082
      - key: EMPLOYER_SERVICE_URL
        value: http://trusthire-employer:8083
      - key: JOB_SERVICE_URL
        value: http://trusthire-job:8084
      - key: VERIFICATION_SERVICE_URL
        value: http://trusthire-verification:8085
      - key: RATING_SERVICE_URL
        value: http://trusthire-rating:8086
      - key: NOTIFICATION_SERVICE_URL
        value: http://trusthire-notification:8087
      - key: SEARCH_SERVICE_URL
        value: http://trusthire-search:8088
      - key: MEDIA_SERVICE_URL
        value: http://trusthire-media:8089

  # --- AUTH SERVICE ---
  - type: web
    name: trusthire-auth
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/auth-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- WORKER SERVICE ---
  - type: web
    name: trusthire-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/worker-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SEARCH_SERVICE_URL
        value: http://trusthire-search:8088
      - key: AUTH_SERVICE_URL
        value: http://trusthire-auth:8081

  # --- EMPLOYER SERVICE ---
  - type: web
    name: trusthire-employer
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/employer-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8083
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- JOB SERVICE ---
  - type: web
    name: trusthire-job
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/job-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8084
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SEARCH_SERVICE_URL
        value: http://trusthire-search:8088
      - key: WORKER_SERVICE_URL
        value: http://trusthire-worker:8082

  # --- VERIFICATION SERVICE ---
  - type: web
    name: trusthire-verification
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/verification-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8085
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: MEDIA_SERVICE_URL
        value: http://trusthire-media:8089

  # --- RATING SERVICE ---
  - type: web
    name: trusthire-rating
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/rating-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8086
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- NOTIFICATION SERVICE ---
  - type: web
    name: trusthire-notification
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/notification-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8087
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- SEARCH SERVICE ---
  - type: web
    name: trusthire-search
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/search-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8088
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- MEDIA SERVICE ---
  - type: web
    name: trusthire-media
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/media-service/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8089
      - key: SPRING_DATASOURCE_URL
        sync: false
