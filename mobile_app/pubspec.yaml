name: trust_hire
description: A unified mobile application for TrustHire Workers and Employers.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  dio: ^5.4.0
  go_router: ^13.1.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  animate_do: ^3.3.4
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  pinput: ^4.0.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf

